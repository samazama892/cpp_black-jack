name: Build Shell Script

on:
  push:
#    branches:
#      - main
#      - develop
#    tags:
#      - 'v*.*.*'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make build script executable
        run: chmod +x build.sh

      - name: Build project
        run: ./build.sh

      - name: Ensure output binary
        run: |
          if [ ! -f ./build/blackjack ]; then
            echo "Error: Output binary not found!" >&2
            exit 1
          fi